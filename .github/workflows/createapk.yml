name: Build Android APK

# Builds the Credence Android app (android-app/) into an installable
# debug APK, entirely in GitHub's cloud — no Android Studio or local
# Android SDK needed on your end. Grab the finished APK from the
# "Artifacts" section at the bottom of the finished run's summary page.
#
# Runs automatically on every push to main that touches android-app/,
# and can always be triggered by hand from the Actions tab ("Run
# workflow") regardless of which branch you're on.

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: credence-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
